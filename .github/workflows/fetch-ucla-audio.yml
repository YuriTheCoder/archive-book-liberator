name: Fetch UCLA audio

on:
  push:
    branches: [tmp-ucla-audio-20260712]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch manifest and audio
        shell: bash
        run: |
          set -u
          mkdir -p out
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          ARK='z18h0m6p'
          MANIFEST="out/${ARK}.json"

          urls=(
            "https://iiif.library.ucla.edu/ark%3A%2F21198%2F${ARK}/manifest"
            "https://iiif.library.ucla.edu/ark:/21198/${ARK}/manifest"
            "https://ingest.iiif.library.ucla.edu/ark%3A%2F21198%2F${ARK}/manifest"
            "https://r.jina.ai/https://iiif.library.ucla.edu/ark%3A%2F21198%2F${ARK}/manifest"
          )

          : > out/fetch.log
          for url in "${urls[@]}"; do
            echo "Trying $url" | tee -a out/fetch.log
            if curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
              -A "$UA" -H 'Accept: application/json,*/*' "$url" -o "$MANIFEST"; then
              if python - "$MANIFEST" <<'PY'
import json, sys
json.load(open(sys.argv[1], encoding='utf-8'))
PY
              then
                echo "Fetched valid JSON: $url" | tee -a out/fetch.log
                break
              fi
            fi
          done

          curl -L --fail --retry 2 --max-time 120 -A "$UA" \
            'https://digital.library.ucla.edu/catalog/ark:/21198/z18h0m6p' \
            -o out/catalog.html || true

          python <<'PY'
import json, pathlib, re
out=pathlib.Path('out')
priority=[]; other=[]

def add(u, high=False):
    if not isinstance(u,str) or not u.startswith(('http://','https://')):
        return
    (priority if high else other).append(u)

def walk(x):
    if isinstance(x,dict):
        fmt=str(x.get('format','')).lower()
        typ=str(x.get('type','')).lower()
        for k,v in x.items():
            if k in ('id','@id'):
                add(v, fmt.startswith('audio/') or typ in ('sound','audio'))
            walk(v)
    elif isinstance(x,list):
        for v in x: walk(v)
    elif isinstance(x,str):
        for u in re.findall(r'https?://[^\s\"<>]+',x):
            if any(s in u.lower() for s in ('wowza','audio','.mp3','.mp4','.m4a','.wav','.m3u8')):
                add(u.rstrip('),]}'))

p=out/'z18h0m6p.json'
if p.exists():
    try: walk(json.load(open(p,encoding='utf-8')))
    except Exception as e: print('manifest parse error',e)

h=out/'catalog.html'
if h.exists():
    text=h.read_text(errors='ignore')
    for u in re.findall(r'https?://[^\s\"<>]+',text):
        u=u.replace('&amp;','&').rstrip('),]}')
        if any(s in u.lower() for s in ('wowza','audio','.mp3','.mp4','.m4a','.wav','.m3u8')):
            add(u)

seen=set(); ordered=[]
for u in priority+other:
    if u not in seen:
        seen.add(u); ordered.append(u)
(out/'audio_urls.txt').write_text('\n'.join(ordered)+'\n',encoding='utf-8')
print('\n'.join(ordered))
PY

          : > out/attempts.log
          found=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            echo "$url" | tee -a out/attempts.log
            if timeout 600 ffmpeg -nostdin -y -loglevel warning \
              -user_agent "$UA" -i "$url" -vn -codec:a libmp3lame -q:a 2 \
              out/Iyere_Ifa_Ile_Awo_Osogbo.mp3 >>out/attempts.log 2>&1; then
              if [ -s out/Iyere_Ifa_Ile_Awo_Osogbo.mp3 ]; then
                found=1
                break
              fi
            fi
          done < out/audio_urls.txt

          if [ "$found" -eq 1 ]; then
            ffprobe -v error -show_entries format=duration,size,format_name \
              -of default=noprint_wrappers=1 out/Iyere_Ifa_Ile_Awo_Osogbo.mp3 \
              > out/audio_info.txt || true
            echo 'Audio downloaded successfully.' | tee -a out/fetch.log
          else
            echo 'No downloadable audio URL succeeded.' | tee -a out/fetch.log
          fi

          ls -lah out | tee -a out/fetch.log

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ucla-audio
          path: out/
          if-no-files-found: error
          retention-days: 1
