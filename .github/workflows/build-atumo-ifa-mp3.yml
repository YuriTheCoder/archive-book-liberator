name: Build Atumo Ifa MP3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-atumo-ifa-mp3.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated download branch
        uses: actions/checkout@v4
        with:
          ref: atumo-ifa-audio-download
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download and convert the public-domain recording
        run: |
          ffmpeg -y -loglevel warning \
            -i 'https://wowza.library.ucla.edu/iiif_av_public/definst/mp4:MEAP/pairtree_root/21/19/8=/z1/4b/51/tn/21198=z14b51tn/ark%2B=21198=z14b51tn.mp4/playlist.m3u8' \
            -vn -c:a libmp3lame -b:a 192k \
            'Atumo_Ifa_Irete_Ofun_1969.mp3'

      - name: Verify output
        run: |
          test -s 'Atumo_Ifa_Irete_Ofun_1969.mp3'
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 'Atumo_Ifa_Irete_Ofun_1969.mp3'

      - name: Commit downloadable MP3 to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Atumo_Ifa_Irete_Ofun_1969.mp3'
          git commit -m 'Add Atumo Ifa - Irete Ofun MP3'
          git push origin HEAD:atumo-ifa-audio-download
