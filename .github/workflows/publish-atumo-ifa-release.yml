name: Publish Atumo Ifa MP3 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-atumo-ifa-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audio branch
        uses: actions/checkout@v4
        with:
          ref: atumo-ifa-audio-download
          fetch-depth: 0

      - name: Verify MP3
        run: test -s 'Atumo_Ifa_Irete_Ofun_1969.mp3'

      - name: Create release and upload MP3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view atumo-ifa-1969 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload atumo-ifa-1969 'Atumo_Ifa_Irete_Ofun_1969.mp3' --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create atumo-ifa-1969 'Atumo_Ifa_Irete_Ofun_1969.mp3' \
              --repo "$GITHUB_REPOSITORY" \
              --target atumo-ifa-audio-download \
              --title 'Atumo Ifa — Irete Ofun (1969)' \
              --notes 'Public-domain archival recording from the Institute of African Studies, University of Ibadan. Converted from the UCLA Library HLS stream to MP3.'
          fi
